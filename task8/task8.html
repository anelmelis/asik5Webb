<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8 </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:antiquewhite;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color:rgb(250, 240, 255);
            padding: 25px;
            border-radius: 12px;
        }

        input[type="text"] {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 10px;
            background-color: #f9aef4;
            border-radius: 5px;
            gap: 10px;
        }

        li label {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Task 8 - To-Do List</h1>

        <input type="text" id="taskInput"
               placeholder="Enter a task">

        <button id="addButton">Add Task</button>

        <ul id="taskList"></ul>
    </div>

    <script src="task8.js"></script>
</body>
</html>
